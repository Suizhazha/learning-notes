name: Sync 当前分支 → master

# ============================================================
# 触发条件：当前分支（learn-rag 或任意非 master 分支）被 push 时触发
# ============================================================
on:
  push:
    branches-ignore:
      - master
      - main

# ============================================================
# 权限：使用 GITHUB_TOKEN 推送回 master 必须明确授予 write 权限
# ============================================================
permissions:
  contents: write
  pull-requests: read

# ============================================================
# 防止并发：同一时间只允许一个同步任务执行，避免并发写入 master
# ============================================================
concurrency:
  group: sync-to-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 仅在私有仓库或需要 fork PR 时限制分支策略；公开仓库可省略
    if: github.event.pusher.type != 'Bot'

    steps:
      # ----------------------------------------------------------
      # 0. 关闭 GitHub Actions 自动创建的后台 merge commit 行为
      #    （避免与我们手动 merge 冲突）
      # ----------------------------------------------------------
      - name: Disable auto-merge
        run: echo "GitHub auto-merge handled manually below"

      # ----------------------------------------------------------
      # 1. 检出仓库（使用 fetch-depth: 0 拿到完整历史，merge 需要）
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # 2. 配置 Git 用户（commit 需要身份）
      # ----------------------------------------------------------
      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ----------------------------------------------------------
      # 3. 预检：差异审查 + 冲突预演（关键安全步骤）
      #    - 若 master 比当前分支领先超过 N 个提交，警告人工
      #    - 若存在冲突，输出冲突文件列表并失败退出
      # ----------------------------------------------------------
      - name: Pre-check diff and conflict
        id: precheck
        run: |
          set -euo pipefail
          SOURCE_BRANCH="${{ github.ref_name }}"
          echo "源分支: $SOURCE_BRANCH"

          # 3.1 获取 origin/master 与 origin/<source> 最新提交
          git fetch origin master --depth=1
          git fetch origin "$SOURCE_BRANCH" --depth=1

          # 3.2 展示当前分支独有的提交（diff: master..HEAD）
          echo "===== 待同步的提交列表 ====="
          git log --oneline origin/master..origin/"$SOURCE_BRANCH" || true

          # 3.3 冲突预演：用一个临时分支模拟 merge
          PRECHECK_BRANCH="precheck/$SOURCE_BRANCH-$(date +%s)"
          git checkout -b "$PRECHECK_BRANCH" origin/master
          if git merge --no-commit --no-ff "origin/$SOURCE_BRANCH" 2>/tmp/merge.err; then
            echo "✅ 无冲突，可自动合并"
            # 取消暂存（pre-check 不真正提交）
            git merge --abort || true
          else
            echo "❌ 检测到合并冲突，需要人工介入"
            echo "冲突文件："
            git diff --name-only --diff-filter=U || true
            cat /tmp/merge.err
            exit 1
          fi

      # ----------------------------------------------------------
      # 4. 执行合并：将源分支合入 master（使用 --no-ff 保留合并轨迹）
      # ----------------------------------------------------------
      - name: Merge into master
        run: |
          set -euo pipefail
          SOURCE_BRANCH="${{ github.ref_name }}"

          git checkout master
          git reset --hard origin/master
          git merge --no-ff "origin/$SOURCE_BRANCH" \
            -m "merge: 自动同步 $SOURCE_BRANCH → master (commit ${{ github.sha }})"

      # ----------------------------------------------------------
      # 5. 推送到远程 master
      # ----------------------------------------------------------
      - name: Push to origin/master
        run: git push origin master

      # ----------------------------------------------------------
      # 6. 失败通知（PR/Issue 提示人工介入）
      # ----------------------------------------------------------
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::合并失败，请人工处理后手动同步。"
          echo "提示：在本地执行 'git checkout master && git pull && git merge ${{ github.ref_name }}'"