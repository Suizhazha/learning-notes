<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>北京永鑫宾馆</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #2d1b69 0%, #1a1a40 50%, #0e1a40 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #fff;
    padding: 20px;
  }
  .card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 30px;
    max-width: 700px;
    width: 100%;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.1);
    text-align: center;
  }
  .hotel-name {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #e2e2e2, #ffffff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hotel-address {
    font-size: 14px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 20px;
  }
  .hotel-img {
    width: 100%;
    border-radius: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    object-fit: cover;
    max-height: 450px;
  }
  .badge {
    display: inline-block;
    margin-top: 16px;
    padding: 6px 16px;
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
    font-size: 13px;
    color: rgba(255,255,255,0.6);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="hotel-name">北京永鑫宾馆</div>
    <div class="hotel-address">📍 幸福三巷</div>
    <img class="hotel-img" src="https://store.is.autonavi.com/showpic/646ef0bf3bcbbeaf73b4f8b5b57fbf6e" alt="北京永鑫宾馆">
    <div class="badge">🏨 北京南站附近酒店</div>
  </div>
  <script>document.title = '北京永鑫宾馆';</script>
</body>
</html>
